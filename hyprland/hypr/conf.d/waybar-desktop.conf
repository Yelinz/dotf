# Desktop Waybar integration for Hyprland.
# This file is sourced by the repo-managed hyprland.conf.

# Start Waybar once per session using the tracked desktop bar config.
exec-once = waybar -b desktop -c ~/.config/waybar/config -s ~/.config/waybar/style.css

# Optional blur rules for Waybar's layer namespace.
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.2, match:namespace waybar
layerrule = blur_popups on, match:namespace waybar