  trek:
    logging: *default-logging
    image: mauriceboe/trek:latest
    container_name: trek
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    ports:
      - "${LAN_IP}:3043:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}   # generate with: openssl rand -hex 32
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - APP_URL=${APP_URL:-}                 # required for OIDC + email links
      - COOKIE_SECURE=false
    volumes:
      - ./trek-conf/data:/app/data
      - ./trek-conf/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  glances:
    logging: *default-logging
    image: nicolargo/glances:latest-full
    container_name: glances
    profiles: ["monitoring"]
    restart: unless-stopped
    # Host-level view keeps package services (e.g. jellyfin) visible too
    network_mode: host
    pid: host
    environment:
      - TZ=Europe/Berlin
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro

  # --------------
  # Social media automation stack
  # --------------
  temporal-elasticsearch:
    logging: *default-logging
    image: elasticsearch:7.17.27
    container_name: temporal-elasticsearch
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      - logger.level=WARN
    expose:
      - 9200
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal:
    logging: *default-logging
    image: temporalio/auto-setup:1.24.2
    container_name: temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PWD: ${DB_PASSWORD}
      POSTGRES_SEEDS: database
      ENABLE_ES: "true"
      ES_SEEDS: temporal-elasticsearch
      ES_VERSION: v7
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamic_config/docker.yaml
      LOG_LEVEL: warn
    volumes:
      - ./temporal-conf/dynamic_config:/etc/temporal/dynamic_config
    depends_on:
      database:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z $(hostname -i | awk '{print $1}') 7233 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # n8n:
  #   build:
  #     context: ./n8n-conf
  #     dockerfile: Dockerfile
  #   container_name: n8n
  #   restart: unless-stopped
  #   ports:
  #     - "5678:5678"
