  #     - GENERIC_TIMEZONE=Europe/Berlin
  #     # Buffer.com API — fill in .env (see SETUP.md for how to find profile IDs)
  #     - BUFFER_ACCESS_TOKEN=${BUFFER_ACCESS_TOKEN:-}
  #     - BUFFER_TIKTOK_PROFILE_ID=${BUFFER_TIKTOK_PROFILE_ID:-}
  #     - BUFFER_INSTAGRAM_PROFILE_ID=${BUFFER_INSTAGRAM_PROFILE_ID:-}
  #     - BUFFER_X_PROFILE_ID=${BUFFER_X_PROFILE_ID:-}
  #     # Postiz self-hosted API key (Settings → API Keys in the Postiz UI)
  #     - POSTIZ_API_KEY=${POSTIZ_API_KEY:-}
  #     # Postiz integration UUIDs — run: curl http://postiz:5000/api/v1/integrations -H "Authorization: Bearer $POSTIZ_API_KEY"
  #     - POSTIZ_YOUTUBE_INTEGRATION_ID=${POSTIZ_YOUTUBE_INTEGRATION_ID:-}
  #     - POSTIZ_REDDIT_INTEGRATION_ID=${POSTIZ_REDDIT_INTEGRATION_ID:-}
  #     - POSTIZ_FACEBOOK_INTEGRATION_ID=${POSTIZ_FACEBOOK_INTEGRATION_ID:-}
  #     # Groq free-tier API for EN→ZH translation via Llama — get key at console.groq.com
  #     - GROQ_API_KEY=${GROQ_API_KEY:-}
  #   volumes:
  #     - ./n8n-conf/data:/home/node/.n8n
  #     - ./n8n-conf/videos:/videos
  #   depends_on:
  #     database:
  #       condition: service_healthy

  mailpit:
    logging: *default-logging
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "${LAN_IP}:8025:8025"
    expose:
      - "1025"

  postiz:
    logging: *default-logging
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: postiz
    restart: unless-stopped
    labels:
      autoheal: "true"
    healthcheck:
      # Probe the backend directly (the process that silently hangs on cold-boot).
      # node is always present in the image; curl is not.
      test: ["CMD", "node", "-e", "const r=require('http').get('http://127.0.0.1:3000/auth/can-register',s=>process.exit(s.statusCode<500?0:1));r.setTimeout(5000,()=>{r.destroy();process.exit(1)});r.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    # No LAN port on purpose: Postiz auto-authenticates every request as admin
    # (see postiz-conf/nginx.conf), so its only entry point is
    # https://postiz.home.lan through Caddy + Authelia (two_factor).
    # To reach it directly again, uncomment these and `docker compose up -d postiz`.
    # ports:
    #   - "${LAN_IP}:5000:5000"
    #   - "${LAN_IP}:4200:4200"
    environment:
      MAIN_URL: "${POSTIZ_URL:-http://192.168.1.2:5000}"
      FRONTEND_URL: "${POSTIZ_URL:-http://192.168.1.2:5000}"
      # Combined image: nginx routes /api/ -> backend, so the browser reaches the
      # backend at <frontend>/api. The /api suffix is REQUIRED (without it the
      # frontend calls /user/self etc. and gets 404s). This was the root misconfig.
      NEXT_PUBLIC_BACKEND_URL: "${POSTIZ_URL:-http://192.168.1.2:5000}/api"
      JWT_SECRET: ${POSTIZ_JWT_SECRET}
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@database:5432/postiz"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      IS_GENERAL: "true"
      REDIS_URL: "redis://redis:6379"
      DISABLE_REGISTRATION: "false"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      TEMPORAL_ADDRESS: "temporal:7233"
      TZ: Europe/Berlin
      NOT_SECURED: "true"
      EMAIL_PROVIDER: "nodemailer"
      EMAIL_HOST: "mailpit"
      EMAIL_PORT: "1025"
      EMAIL_SECURE: "false"
      EMAIL_FROM_NAME: "Postiz"
      EMAIL_FROM_ADDRESS: "noreply@postiz.local"
    volumes:
      - ./postiz-conf/uploads:/uploads
      - ./postiz-conf/config:/config
      # AUTO-AUTH (local-only, single user): nginx injects a fixed admin JWT on every
      # request, so Postiz never shows a login screen. Anyone who can reach :5000 is
      # admin — acceptable because this is LAN-only. Replaces the cookie patch.
      - ./postiz-conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Lightweight watchdog: restarts containers labeled autoheal=true when their
  # Docker healthcheck reports unhealthy. ~3-5MB RAM, polls every 30s, negligible IO.
  # autoheal:
  #   image: willfarrell/autoheal:latest
  #   container_name: autoheal
  #   restart: unless-stopped
  #   environment:
  #     AUTOHEAL_CONTAINER_LABEL: autoheal
  #     AUTOHEAL_INTERVAL: "30"
  #     AUTOHEAL_START_PERIOD: "60"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

  # --------------
  # Edge proxy + SSO
  # --------------
  caddy:
    logging: *default-logging
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTPS_PORT:-443}:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-home.arpa}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./caddy-conf/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-conf/data:/data
      - ./caddy-conf/config:/config
    # Reaches natively-installed Jellyfin (:8096) and Glances (:61208)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Also on vpn_isolated so it can reach vpn-sidecar:8112 (Deluge's web UI)
    # to front it with Authelia. Joining this network only gives Caddy HTTP
    # access to that one port - it doesn't touch deluge's torrent traffic or
    # route anything through the VPN tunnel.
    networks:
      - default
      - vpn_isolated
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # Not started by default (profile "sso").  Bring it up with:
  #   docker compose --profile sso up -d authelia
  authelia:
    logging: *default-logging
    image: authelia/authelia:latest
    container_name: authelia
    profiles: ["sso"]
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./authelia-conf/configuration.yml:/config/configuration.yml:ro
      - ./authelia-conf/users_database.yml:/config/users_database.yml
      - ./authelia-conf/data:/data
      - ./authelia-conf/secrets:/secrets:ro
    environment:
      X_AUTHELIA_CONFIG: /config/configuration.yml
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption_key
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt_secret
      # Uncomment together with the identity_providers block in configuration.yml
      # AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /secrets/oidc_hmac_secret
      TZ: Europe/Berlin
    expose:
      - "9091"
    security_opt:
      - no-new-privileges:true

  # =========================================================================
  # PUBLIC SHARE LINKS:  internet -> Cloudflare -> cloudflared -> share-proxy
  #                      -> immich_server.   Runbook: immich-public-sharing.md
  #
  # cloudflared only dials OUT (no router port, no inbound listener).  Each hop
  # is on its own network, so by container name a tunnel route can reach
  # share-proxy:8080 and nothing else.  LAN addresses (ports published on
  # LAN_IP, the router) stay reachable via cf_egress until the staged
  # cloudflared-egress.nft is applied.  Routes live in the Cloudflare
  # dashboard (remotely-managed tunnel).
  # =========================================================================

  # Share-links-only reverse proxy (allowlist in share-proxy-conf/Caddyfile).
  # Separate from the main Caddy on purpose: its whole config is the public
  # attack surface, and it has no route to anything but immich_server.
  share-proxy:
    logging: *default-logging
    image: caddy:2-alpine
    container_name: share-proxy
    restart: unless-stopped
    environment:
      # Must match Immich -> Administration -> Settings -> Server ->
      # External domain (https://<this>), and the tunnel route's hostname.
      IMMICH_SHARE_HOST: ${IMMICH_SHARE_HOST:-photos.example.com}
    volumes:
      - ./share-proxy-conf/Caddyfile:/etc/caddy/Caddyfile:ro
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /data:size=8m,mode=0700,uid=65532,gid=65532
      - /config:size=8m,mode=0700,uid=65532,gid=65532
    cap_drop:
      - ALL
    # Only so the image's setcap'd caddy binary may exec (listens on :8080).
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100
    networks:
      - cf_tunnel
      - immich_edge
    depends_on:
      - immich-server

  cloudflared:
    logging: *default-logging
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflared_token
    secrets:
      - cloudflared_token
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100
    networks:
      - cf_egress   # internet (Cloudflare edge) - nothing else lives here
      - cf_tunnel   # internal, shared only with share-proxy
    depends_on:
      - share-proxy

networks:
  dawarich:
  vpn_isolated:
  # wg-server only.  Peers are masqueraded onto it, then out via the host.
  wg_server:
  # cloudflared's way out.  Fixed bridge name so the staged egress firewall
  # (cloudflared-egress.nft) can keep it off the LAN.
  cf_egress:
    driver_opts:
      com.docker.network.bridge.name: br-cfegress
  # cloudflared <-> share-proxy.  internal: no gateway, no internet.
  cf_tunnel:
    internal: true
  # share-proxy <-> immich_server.  internal: no gateway, no internet.
  immich_edge:
    internal: true

secrets:
  # The tunnel token (one line, eyJ...).  Set it with cloudflared-set-token.sh.
  # 0644 inside a 0700 directory: only `media` can reach it on the host, and
  # cloudflared's uid 65532 can read it inside the container.
  cloudflared_token:
    file: ./cloudflared-conf/tunnel-token
