  # --------------
  # Immich containers
  # --------------
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
                - compute
                - video
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      # Honour X-Forwarded-For/-Proto from Caddy and share-proxy (both on
      # Docker bridges), so Immich sees the real client and https.
      IMMICH_TRUSTED_PROXIES: 172.16.0.0/12
    ports:
      - '${LAN_IP}:2283:2283'
    networks:
      - default
      - dawarich
      # Internal network shared only with share-proxy (public share links).
      - immich_edge
    depends_on:
      - redis
      - database
    restart: unless-stopped
    logging: *default-logging
    blkio_config:
      # Keep Immich app writes below DB priority during contention
      weight: 250
    healthcheck:
      disable: false
  immich-machine-learning:
    container_name: immich_machine_learning
    # Note the `-cuda` at the end
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    # Note the lack of an `extends` section
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    volumes:
      - /opt/docker/immich:/cache
    env_file:
      - .env
    restart: unless-stopped
    logging: *default-logging
    blkio_config:
      # Lowest priority among the Immich components
      weight: 150
    healthcheck:
      disable: false
  redis:
    logging: *default-logging
    container_name: immich_redis
    command: ["--loglevel", "warning"]
    image: docker.io/valkey/valkey:9@sha256:fb8d272e529ea567b9bf1302245796f21a2672b8368ca3fcb938ac334e613c8f
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped
    networks:
      - default
      - dawarich
  database:
    build:
      context: ./database-conf
      dockerfile: Dockerfile
    container_name: immich_postgres
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    blkio_config:
      # Keep DB responsive even when other containers are busy
      weight: 400
    networks:
      - default

