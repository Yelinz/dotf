---

# Shared log rotation: caps every container at 30 MB on disk (3 x 10 MB)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  copyparty:
    image: copyparty/ac:latest
    container_name: copyparty
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - ${LAN_IP}:3923:3923
    volumes:
      - ./copyparty-conf:/cfg:z
      - /home/media/Bilder:/w/Bilder:z
      - /home/media/Dokumente:/w/Dokumente:z
      - /home/media/Downloads:/w/Downloads:z
      - /home/media/Schreibtisch:/w/Schreibtisch:z
      - /home/media/Videos:/w/Videos:z
      - /home/media/Musik:/w/Musik:z

    environment:
      LD_PRELOAD: /usr/lib/libmimalloc-secure.so.2
      # enable mimalloc by replacing "NOPE" with "2" for a nice speed-boost (will use twice as much ram)

      PYTHONUNBUFFERED: 1
      # ensures log-messages are not delayed (but can reduce speed a tiny bit)

    logging: *default-logging
    blkio_config:
      # Lower value = lower disk I/O priority when HDDs are saturated
      weight: 200

    stop_grace_period: 15s  # thumbnailer is allowed to continue finishing up for 10s after the shutdown signal
    healthcheck:
      # hide it from logs with "/._" so it matches the default --lf-url filter 
      test: ["CMD-SHELL", "wget --spider -q 127.0.0.1:3923/?reset=/._"]
      interval: 1m
      timeout: 2s
      retries: 5
      start_period: 15s

  backrest:
    logging: *default-logging
    image: ghcr.io/garethgeorge/backrest:latest
    container_name: backrest
    hostname: backrest
    volumes:
      - ./backrest-conf/data:/data
      - ./backrest-conf/config:/config
      - ./backrest-conf/cache:/cache
      - ./backrest-conf/tmp:/tmp
      - ./backrest-conf/rclone:/root/.config/rclone
      - /home/media/Bilder:/userdata/immich-images  # Mount local paths to backup
      - /home/media/tools:/userdata/container-confs  # Mount local paths to backup
      - type: bind
        source: /media/media/Elements
        target: /repos/WDElements
        bind:
          propagation: rslave
      # rslave: follow the host's rclone FUSE mount. With the short syntax the
      # container keeps the empty dir it saw at startup, so restic reports
      # "repository does not exist" whenever rclone remounts after us.
      - type: bind
        source: /mnt/protondrive
        target: /repos/protondrive
        bind:
          propagation: rslave
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=Europe/Berlin
    ports:
      - "${LAN_IP}:9898:9898"
    restart: unless-stopped

