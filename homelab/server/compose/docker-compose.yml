  # --------------
  # Arr stack
  # --------------
  deluge:
    image: lscr.io/linuxserver/deluge:2.2.0
    container_name: deluge
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Europe/Berlin
    volumes:
      - ./deluge-conf:/config
      - /home/media/Downloads:/downloads
      - /home/media:/data
      - /mnt/ssd/deluge-incomplete:/incomplete
    restart: unless-stopped
    logging: *default-logging
    blkio_config:
      # Keep torrent I/O from starving the rest of the host on HDDs
      weight: 10
    cpu_shares: 256
    network_mode: service:vpn-sidecar
    depends_on:
      vpn-sidecar:
        condition: service_healthy

  # LAN resolver: answers *.home.lan for every device on the network so the
  # Caddy vhosts work without per-device hosts entries. Forwards everything
  # else to the FRITZ!Box. Adblock list is mounted but not included - see
  # dns-conf/unbound.conf.
  lan-dns:
    logging: *default-logging
    image: mvance/unbound:latest
    container_name: lan-dns
    restart: unless-stopped
    ports:
      - "${LAN_IP}:53:53/tcp"
      - "${LAN_IP}:53:53/udp"
    volumes:
      - ./dns-conf/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
      - ./dns-conf/home-lan.conf:/opt/unbound/etc/unbound/home-lan.conf:ro
      - ./dns-conf/adblock.conf:/opt/unbound/etc/unbound/adblock.conf:ro
    security_opt:
      - no-new-privileges:true

  vpn-sidecar:
    logging: *default-logging
    image: lscr.io/linuxserver/wireguard:latest
    container_name: vpn-sidecar
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      - vpn_isolated
    ports:
      - ${LAN_IP}:8112:8112
      # Deluge daemon access for deluge-gtk on the host
      - "${LAN_IP}:58846:58847"
    volumes:
      - /lib/modules:/lib/modules
      - ./wireguard-conf:/config
    environment:
      - PUID=911
      - PGID=911
      - TZ=Europe/Berlin
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    healthcheck:
      test: ["CMD", "wg", "show", "wg0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Road-warrior VPN into the LAN (the Zyxel has no built-in WireGuard).
  # Deliberately a separate container from vpn-sidecar: that one is a Proton
  # *client* for Deluge, this is a *server* for our own devices.
  # Exposure: 51820/udp only, on the static public IPv6 (needs a Zyxel IPv6
  # firewall rule) and on LAN_IP (target of the Zyxel IPv4 port forward).
  # Peer keys live in wg-server-conf (-> /mnt/ssd/conf, 911:911 0700).
  # Show a peer's QR: docker exec wg-server /app/show-peer phone
  wg-server:
    logging: *default-logging
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wg-server
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      - wg_server
    ports:
      - "${LAN_IP}:51820:51820/udp"
      - "[${WG_PUBLIC_V6}]:51820:51820/udp"
    volumes:
      - ./wg-server-conf:/config
    environment:
      - PUID=911
      - PGID=911
      - TZ=Europe/Berlin
      # Endpoint written into peer configs.  Raw IP, no DNS dependency.
      - SERVERURL=[${WG_PUBLIC_V6}]
      - SERVERPORT=51820
      - PEERS=${WG_PEERS:-phone,laptop}
      # lan-dns, so *.home.lan resolves over the tunnel
      - PEERDNS=${LAN_IP}
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0, ::/0
      # never print peer private keys / QR codes into docker logs
      - LOG_CONFS=false
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    healthcheck:
      test: ["CMD", "wg", "show", "wg0"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

