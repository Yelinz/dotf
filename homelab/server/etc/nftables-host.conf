#!/usr/sbin/nft -f
#
# Host input firewall - defence in depth for the day this box gets a public
# IPv6 address.  It governs services running on the HOST (sshd, Jellyfin,
# glances, RDP, CUPS).  Container ports are already bound to ${LAN_IP} or
# 127.0.0.1 in docker-compose.yml, and Docker's published ports are DNAT'd
# into the forward hook, so they are not affected by this table.
#
# Caddy (80/443) is a container -> intentionally no rule for it here.
#
# Apply safely - see sso-and-exposure-runbook.md, section "Firewall".
#   sudo nft -c -f /home/media/tools/nftables-host.conf     # syntax check only
#   sudo nft -f  /home/media/tools/nftables-host.conf       # apply
#   sudo nft delete table inet homefw                       # revert

# Recreate the table from scratch without touching Docker's tables.
table inet homefw
delete table inet homefw

table inet homefw {
	set lan4 {
		type ipv4_addr
		flags interval
		elements = { 127.0.0.0/8, 192.168.178.0/24, 172.16.0.0/12 }
	}

	set lan6 {
		type ipv6_addr
		flags interval
		# ::1 loopback, fd00::/8 ULA , fe80::/10 link-local
		elements = { ::1/128, fd00::/8, fe80::/10 }
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif lo accept

		# ICMP / ICMPv6 - IPv6 breaks without this (ND, PMTUD). Never remove.
		ip protocol icmp accept
		meta l4proto ipv6-icmp accept

		# DHCPv6 client (the box gets its prefix this way)
		udp dport 546 accept

		# Containers reaching host services (Caddy -> Jellyfin :8096, Glances :61208)
		iifname "docker0" accept
		iifname "br-*" accept

		# SSH - LAN only
		ip saddr @lan4 tcp dport 22 accept
		ip6 saddr @lan6 tcp dport 22 accept

		# Jellyfin native + its LAN autodiscovery. Public access goes via Caddy,
		# so :8096 itself never needs to be reachable from the internet.
		ip saddr @lan4 tcp dport 8096 accept
		ip6 saddr @lan6 tcp dport 8096 accept
		ip saddr @lan4 udp dport 7359 accept

		# Glances, GNOME remote desktop, CUPS - LAN only
		ip saddr @lan4 tcp dport { 61208, 3389, 3390, 631 } accept
		ip6 saddr @lan6 tcp dport { 61208, 3389, 3390, 631 } accept

		# mDNS / SSDP - LAN only
		ip saddr @lan4 udp dport { 5353, 1900 } accept
		ip6 saddr @lan6 udp dport 5353 accept

		# Everything else, including anything arriving on the public IPv6,
		# is counted and dropped.
		counter comment "dropped-input"
	}
}
