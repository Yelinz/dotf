[Service]
# The VFS cache still holds ~10k restic pack files that were never uploaded
# before the crash. rclone rebuilds that cache -- one Proton API round trip plus
# name decryption per file -- BEFORE it mounts and signals READY. That takes
# hours, not seconds. Any finite start timeout kills it mid-rebuild and the next
# run starts from scratch, so it can never finish. 0 = wait as long as it takes.
TimeoutStartSec=0
RestartSec=30

# Every queued file already has a stale draft on Proton left by the interrupted
# uploads. Without this rclone refuses to overwrite them ("a draft exist") and
# the backlog never drains, no matter how long it runs. Safe here because this
# mount is the only client writing to that path.
ExecStart=
ExecStart=rclone mount proton-drive: /mnt/protondrive --vfs-cache-mode writes --vfs-cache-max-size 500M --vfs-cache-max-age 1h --dir-cache-time 12h --poll-interval 1m --umask 002 --allow-other --protondrive-replace-existing-draft=true --log-level INFO
