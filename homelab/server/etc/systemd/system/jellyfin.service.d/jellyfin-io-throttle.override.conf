# Copy this file to:
# /etc/systemd/system/jellyfin.service.d/io-throttle.conf
# Then run:
#   sudo systemctl daemon-reload
#   sudo systemctl restart jellyfin
#
# Goal: keep Jellyfin responsive without allowing transcodes/library tasks
# to starve HDD I/O used by other apps.

[Service]
Nice=10
IOSchedulingClass=best-effort
IOSchedulingPriority=7
IOWeight=100
CPUWeight=50
IOAccounting=true
CPUAccounting=true
