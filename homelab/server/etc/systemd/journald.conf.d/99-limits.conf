# /etc/systemd/journald.conf.d/99-limits.conf
# Caps the systemd journal, which was unbounded (default SystemMaxUse = 10% of
# /var = ~3.7 GB) and had grown to 2.5 GB on this host.
[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
SystemMaxFileSize=20M
RuntimeMaxUse=64M
# Rotate at least monthly so stale journals cannot pin disk indefinitely
MaxRetentionSec=1month
MaxFileSec=1week
# Do not duplicate everything into /dev/kmsg or forward to syslog (saves IOPS)
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
